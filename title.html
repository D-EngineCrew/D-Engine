<!doctype html><html lang="es"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>D-Engine</title><link rel=stylesheet href=style.css>
<body><canvas id=c style="position:fixed;inset:0;width:100%;height:100%"></canvas>
<script src=engine/core.js></script><script>
// Pantalla de título estilo V-Slice: intro por beats (secuencia del source), logo que rebota, "press enter", cambio de color con swipe.
const g=c.getContext('2d'),BPM=102,SPB=60000/BPM; // 102 BPM = freakyMenu (dato conocido, no está en el source)
let W,H;const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
// Frases: introText.txt de los mods importados ("a--b" por línea); si no hay, las de D-Engine
let lines=[];DE.mods().forEach(m=>(m.intro||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>lines.push(l.split('--'))));
if(!lines.length)lines=[['D-Engine','FNF en tu navegador'],['Psych + V-Slice','+ Codename'],['hecho por','lucam'],['mods','sin versiones']];
const wacky=lines[Math.floor(Math.random()*lines.length)];
const seq={1:['The','Funkin Crew Inc'],3:'presents',4:null,5:['In association','with'],7:'newgrounds',8:null,9:[wacky[0]],11:wacky[1]||'',12:null,13:'Friday',14:'Night',15:'Funkin',16:'SKIP'};
let txt=[],skipped=false,t0=performance.now(),lastBeat=0,hue=0,flash=0,go=false,bump=1,blink=0;
function beat(b){if(skipped)return;const a=seq[b];if(a===undefined)return;if(a===null)txt=[];else if(a==='SKIP')skip();else if(Array.isArray(a))txt=[...a];else txt.push(a)}
function skip(){if(skipped)return;skipped=true;txt=[];flash=1}
function enter(){if(go)return;if(!skipped){skip();return}go=true;flash=1;setTimeout(()=>location.href='index.html',1200)}
addEventListener('keydown',e=>{if(e.key=='Enter')enter();if(e.key=='ArrowLeft')hue-=25;if(e.key=='ArrowRight')hue+=25});
let x0=0;addEventListener('touchstart',e=>x0=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)hue+=d>0?25:-25;else enter()});
addEventListener('click',e=>{if(!('ontouchstart' in window))enter()});
(function loop(){const t=performance.now()-t0,b=Math.floor(t/SPB);while(lastBeat<b){lastBeat++;beat(lastBeat);bump=1.06}
 bump+=(1-bump)*.12;g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.fillRect(0,0,W,H);const k=Math.min(W/1280,H/720);g.textAlign='center';
 if(!skipped){g.fillStyle='#fff';g.font='900 '+56*k*1.3+'px sans-serif';txt.forEach((s,i)=>g.fillText(String(s).toUpperCase(),W/2,H*.3+i*66*k*1.3))}
 else{g.filter='hue-rotate('+hue+'deg)';const grd=g.createLinearGradient(0,0,W,H);grd.addColorStop(0,'#1a2a6c');grd.addColorStop(1,'#b21f1f');g.fillStyle=grd;g.fillRect(0,0,W,H);
  g.save();g.translate(W/2,H*.32);g.scale(bump,bump);g.fillStyle='#FDE871';g.strokeStyle='#0a0a30';g.lineWidth=10*k;g.font='900 '+120*k*1.2+'px sans-serif';g.strokeText('D-ENGINE',0,0);g.fillText('D-ENGINE',0,0);
  g.font='bold '+30*k*1.2+'px sans-serif';g.fillStyle='#fff';g.fillText('Friday Night Funkin\u2019 en tu navegador',0,60*k*1.2);g.restore();
  blink+=go?.5:.06;const on=go?Math.floor(blink)%2:Math.sin(blink)>-.3;if(on){g.fillStyle=go?'#fff':'#FDE871';g.font='900 '+54*k*1.2+'px sans-serif';g.fillText(('ontouchstart' in window)?'TOCA LA PANTALLA':'PRESS ENTER',W/2,H*.82)}g.filter='none'}
 if(flash>0){g.fillStyle='rgba(255,255,255,'+flash+')';g.fillRect(0,0,W,H);flash-=.035}
 requestAnimationFrame(loop)})();
</script></html>
