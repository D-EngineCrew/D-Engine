name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: krdlab/setup-haxe@v1
        with: { haxe-version: 4.3.6 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Dependencias Haxe
        run: |
          haxelib setup ~/haxelib
          haxelib install hmm
          haxelib run hmm install
          haxelib run lime setup -alias -y
      - name: Android SDK/NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r21e }
      - name: Configurar Lime Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
      - name: Compilar APK
        run: haxelib run lime build android -final
      - uses: actions/upload-artifact@v7
        with:
          name: D-Engine-APK
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
